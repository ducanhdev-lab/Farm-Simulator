services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: farm
      POSTGRES_PASSWORD: farm
      POSTGRES_DB: farm_life
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://farm:farm@postgres:5432/farm_life
      JWT_SECRET: dev-secret-change-in-production
    depends_on:
      - postgres

volumes:
  pgdata:
